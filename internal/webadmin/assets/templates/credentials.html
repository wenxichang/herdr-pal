{{define "credentials-content"}}<section id="credentials-page" class="page-section">
  <section class="panel"><div class="panel-heading"><div><h2>签发机器凭据</h2><p class="muted">同一用户与机器标识只能存在一条凭据。</p></div></div>
    <form id="credential-form" class="inline-form">
      <label>用户 ID<input name="principal_id" required></label><label>机器标识<input name="machine_id" required></label><label>来源地址（逗号分隔）<input name="sources" required></label><label>过期时间（可选）<input name="expires_at" type="datetime-local"></label><button class="primary" type="submit">签发</button>
    </form>
  </section>
  <section class="panel"><div class="panel-heading"><h2>凭据列表</h2><button class="secondary" data-action="refresh-credentials">刷新</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>用户</th><th>机器</th><th>状态</th><th>来源</th><th>操作</th></tr></thead><tbody id="credentials-body"></tbody></table></div><button id="credentials-next" class="secondary" hidden>下一页</button></section>
</section>{{end}}
