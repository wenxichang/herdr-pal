name: herdr-pal-audit

services:
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.157.0}
    profiles:
      - collector
    command:
      - --config=/etc/otelcol/config.yaml
    restart: unless-stopped
    depends_on:
      - loki
    ports:
      - 127.0.0.1:4318:4318
      - 127.0.0.1:13133:13133
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    mem_limit: 512m

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.0}
    command:
      - -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    ports:
      - 127.0.0.1:3100:3100
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    mem_limit: 2g

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.0}
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请在 .env 中设置 GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 1g

volumes:
  loki-data:
  grafana-data:
